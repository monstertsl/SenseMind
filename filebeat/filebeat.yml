filebeat.config.modules:
  path: /etc/filebeat/modules.d/*.yml
  reload.enabled: false


# =========================
# Modules
# =========================
filebeat.modules:

- module: suricata
  eve:
    enabled: true
    var.paths: ["/var/log/suricata/eve.json"]

- module: zeek
  connection:
    enabled: true
    var.paths: ["/var/log/zeek/conn.log"]
  # zeek 端过滤脚本保留 conn + http 流，dns/ssl 不再产出
  dns:
    enabled: false
  http:
    enabled: true
    var.paths: ["/var/log/zeek/http.log"]
  ssl:
    enabled: false


# =========================
# OUTPUT
# =========================
#output.elasticsearch:
#  hosts: ["http://elasticsearch:9200"]
#  api_key: "${FILEBEAT_API_KEY}"

output.logstash:
  hosts:
    # 中心自身走内网明文通道 5045（5044 已升级为探针 TLS+mTLS 专用，F8）
    - "logstash:5045"

# =========================
setup.template.enabled: true
setup.ilm.enabled: false
logging.to_stderr: true
logging.level: info

# 删除 Filebeat 模块自动保留的原始日志副本 event.original
# 该字段与已结构化字段完全重复，且仅磁盘原始日志(/data)已留存，删之省约 20% ES 空间
processors:
  - drop_fields:
      fields: ["event.original"]
      ignore_missing: true
