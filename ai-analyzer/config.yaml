# SenseMind AI 分析中心配置文件
# LLM 模型配置已迁移到系统设置 > 集成配置 > LLM 模型配置 页面（DB 存储）

########################################
# Elasticsearch 配置
########################################
elasticsearch:
  # ES 地址（容器内通过服务名访问）
  hosts: "https://elasticsearch:9200"
  # CA 证书路径（容器内）
  ca_cert: "/usr/share/ai-analyzer/certs/ca.crt"
  # 凭据 - 从环境变量读取（部署时由 docker-compose 注入）
  # ELASTIC_PASSWORD 由 .env 提供
  username: "elastic"
  password_env: "ELASTIC_PASSWORD"

  # 告警源索引模式
  alert_index: "soc-*"
  # 分析结果写入索引
  result_index: "soc-ai-%{date}"

  # 关联查询配置
  correlation:
    # 按 community_id 关联的日志条数上限
    max_related_logs: 20
  # 回退到 IP+时间窗口关联时的窗口（秒）
  time_window_seconds: 300

########################################
# Webhook 配置
########################################
webhook:
  host: "0.0.0.0"
  port: 9090

########################################
# 知识库配置 (RAG 检索源)
# 目录结构：
#   knowledge/
#   ├── mitre-attack/     # MITRE ATT&CK 技术说明 (.md)
#   ├── soc-playbook/     # SOC 处置手册 (.md)
#   └── suricata-rules/   # Suricata 规则说明 (.md)
########################################
knowledge:
  dir: "/usr/share/ai-analyzer/knowledge"

########################################
# Suricata 规则自动生成配置
# 当 AI 确认攻击但原始告警未触发 soc.matched 时，
# 自动生成低误报率规则写入 local.rules 并热加载。
########################################
suricata:
  enabled: true
  # local.rules 文件路径（容器内，对应宿主机 /data/suricata/lib/rules/local.rules）
  rules_file: "/suricata/rules/local.rules"
  # suricata 容器名称（用于 docker exec suricatasc 热加载规则）
  suricata_container: "suricata"
  # 写入前的误报复核（历史流量回放 + LLM 二次裁定，全自动、无需人工）
  fp_guard:
    enabled: true
    # 回放窗口：回看最近 N 天 HTTP 流量统计规则 content 的命中基数。
    # 实际取值会被自动收敛到 min(lookback_days, 系统设置里的「原始日志保留天数」)，
    # 避免窗口超出 soc-* 索引留存范围导致命中数被低估、硬阈值静默失效
    lookback_days: 7
    # LLM 二次裁定的硬超时（秒）：超时 / 出错 / 返回无法解析时，
    # 一律降级为下面的纯证据硬阈值判定，不阻塞规则写入链路
    llm_timeout: 30
    # 以下为 LLM 不可用时的纯证据硬阈值（满足则判定为业务常态签名并拒写）：
    # 主特征命中数 ≥ reject_hits 且 独立源 IP ≥ reject_distinct_src
    # 且 全部 content 组合命中占比 ≥ reject_combo_ratio
    reject_hits: 100
    reject_distinct_src: 5
    reject_combo_ratio: 0.5
    # 主特征绝对高频（ ≥ reject_hits_absolute ）时的放宽门槛：
    # 纯 URI 规则的组合占比 ≥ reject_absolute_ratio 才判噪声；
    # 占比无法评估（含请求体 content / 组合回放失败）时一律判噪声
    reject_hits_absolute: 50000
    reject_absolute_ratio: 0.05

########################################
# 告警去重配置
# 同一 community_id + signature_id 在时间窗口内只分析一次
########################################
dedup:
  enabled: true
  # 去重时间窗口（秒），默认 600 = 10 分钟
  window_seconds: 600
  # 内存缓存最大条数（LRU 淘汰）
  max_entries: 10000
