name: Sync GitHub to Gitee  # 工作流名称

# 触发条件：当代码推送到 GitHub 的 main 分支时触发
on:
  push:
    branches: [ main ] #触发分支
  workflow_dispatch:

# 工作流任务
jobs:
  sync:
    runs-on: ubuntu-latest  # 运行环境（Ubuntu 系统）
    steps:
      # 同步
      - name: Sync to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/monstertsl
          dst: gitee/monstertsl
          dst_key: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          account_type: user
          clone_style: https
          static_list: "SenseMind"
          force_update: true
          debug: true
